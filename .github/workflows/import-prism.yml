name: import-prism
on:
  push:
    paths:
      - 'shared/stage/preview/prism-pack/.import-trigger'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download PRISM artifact
        run: |
          mkdir -p shared/stage/preview/prism-pack
          curl -L --fail --silent --show-error "https://aka.doubaocdn.com/s/Py9FkaUU4Q" -o shared/stage/preview/prism-pack/index.html
          curl -L --fail --silent --show-error "https://aka.doubaocdn.com/s/Y3oZvrklV0" -o shared/stage/preview/prism-pack/README.md
      - name: Commit imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shared/stage/preview/prism-pack/index.html shared/stage/preview/prism-pack/README.md
          git commit -m "feat: add PRISM holographic card pack replica" || echo "no changes"
          git push
