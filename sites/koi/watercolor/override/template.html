<!doctype html>
<html lang=en>
<head>
<meta charset=utf-8>
<title>Watercolor Koi · Soft colors, slow fins</title>
<meta name=description content="Watercolor koi in a gentle wash of color. A quiet place to watch fish swim.">
<meta name=keywords content="watercolor koi, koi painting, watercolor fish, koi art">
<meta name=viewport content="width=device-width,initial-scale=1">
<meta name=theme-color content=#514463>
<style>
html{background:#514463}body{position:fixed;inset:0;margin:0;overflow:hidden;background:radial-gradient(#a88fbb,#514463 72%);font:700 clamp(13px,.7vw+.9vh,36px)/1.4 system-ui,sans-serif;color:#faf4f8;-webkit-user-select:none;user-select:none}
@media(orientation:portrait) and (pointer:coarse){body{width:100dvh;height:100dvw;transform-origin:0 0;transform:rotate(90deg) translateY(-100%)}}
canvas#c{position:absolute;width:100%;height:100%;touch-action:none;cursor:crosshair;transition:filter 1s,transform 1s,opacity 2s}
body:not(.g) canvas#c{filter:blur(1vmax) brightness(.5);transform:scale(1.06)}.l canvas#c{opacity:0}
#m{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:min(1em,3vmin);padding:1em;text-align:center;background:radial-gradient(#51446300 30%,#514463d9);transition:opacity .5s,visibility .5s}
.g #m,.m #l,.l #g{opacity:0;visibility:hidden}
h1{margin:0;font:900 4.4em/1 system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#0000;background:linear-gradient(#fff,#e6cddf 60%,#b08bae);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 .06em .2em #000c)}
p{margin:0}#sub{max-width:30em;font-size:1.05em}#sub-zh{max-width:30em;font-size:.78em;opacity:.75}
#stage{width:min(34em,88vw);height:min(15em,32vh);border-radius:.5em;box-shadow:0 .6em 2em #0008}
#a{display:grid;width:27em;max-width:100%}#a>*{grid-area:1/1;transition:opacity .8s,visibility .8s}
#s,#w,#q,#k,#h{font-size:.8em;letter-spacing:.12em;text-transform:uppercase}#w{margin-top:1.2em;color:#e6cddf}
#p{height:.5em;margin:.4em 0 1em;overflow:hidden;border-radius:1em;background:#514463;box-shadow:0 0 0 2px #e6cddf80,0 0 1.5em #b08bae}#b{display:block;height:100%;background:linear-gradient(90deg,#b08bae,#faf4f8);transform:scaleX(0);transform-origin:0;will-change:transform}
.e #p{visibility:hidden}.e #s{font-size:1.1em;letter-spacing:0;text-transform:none}
button{display:flex;align-items:center;justify-content:center;gap:.6em;padding:.8em 1.4em;border:0;border-radius:.5em;background:#faf4f8;box-shadow:inset 0 -.2em #0003,0 .3em 1em #0009;font:800 1em/1.2 system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#514463;cursor:pointer;transition:transform .12s,filter .12s}
button:hover{transform:translateY(-.12em);filter:brightness(1.1)}button:active{transform:translateY(.1em)}:focus-visible{outline:3px solid #faf4f8;outline-offset:3px}
#g{display:grid;gap:min(.8em,2.4vmin);justify-items:center}#act{padding:.9em;background:linear-gradient(#e6cddf,#b08bae);font-size:1.2em}.row{display:flex;gap:.6em;flex-wrap:wrap;justify-content:center}.row button{font-size:.76em;opacity:.88}
#q,#k,#h{padding:1em 1.6em;border-radius:.7em;background:#514463b3}#q{display:flex;align-items:center;gap:.4em;padding:.4em}#q span{flex:1;color:#e6cddf}#q button{flex:1.2;padding:.7em 0;background:none;box-shadow:none;color:#faf4f8}#q button:hover{background:#e6cddf33}#q .on{background:linear-gradient(#e6cddf,#b08bae);color:#514463;pointer-events:none}
#k{display:flex;justify-content:center;gap:2em;text-align:left}#k p{display:grid;grid-template-columns:auto auto;gap:.55em .9em;align-items:center}#k i{display:flex;justify-self:end;font-style:normal}#k b{min-width:1.1em;padding:.2em .5em;border-radius:.35em;background:#faf4f8;color:#514463;text-align:center}
#h{display:none}@media(pointer:coarse),(max-height:30em){#k{display:none}}@media(pointer:coarse){#h{display:block}}
#o{position:absolute;top:.6em;right:.6em;display:none;padding:.3em .6em;background:#514463d9;box-shadow:inset 0 0 0 2px #e6cddf;font-size:1.3em;color:#faf4f8;opacity:.8}.g #o{display:flex}.p #o{display:none}
#i{position:absolute;top:1em;left:1.2em;margin:0;font:.8em/1.6 ui-monospace,Consolas,monospace;white-space:pre-wrap;text-shadow:0 1px 4px #000;pointer-events:none}
</style>
</head>
<body class=l>
<canvas id=c></canvas>
<div id=m>
<h1>Watercolor Koi</h1>
<div id=a>
<div id=l><div id=p><i id=b></i></div><p id=s>Mixing the pigments…</p><p id=w hidden>Use Google Chrome for optimal experience</p></div>
<div id=g>
<p id=sub>Soft colors, slow fins.</p><p id=sub-zh>柔软的颜色，缓慢的鳍。</p>
<canvas id=stage aria-label="koi pond"></canvas>
<p class=row><button id=act>Watch</button><button id=listen>Listen</button><button id=leave>Leave</button><button id=d>Enter scene</button></p>
<p id=q><span>Detail</span><button>Low</button><button>Medium</button><button>High</button></p>
<div id=k><p><i><b>Watch</b></i>Stay a while <i><b>M</b></i>Listen <i><b>Esc</b></i>Leave</p></div>
<p id=h>Watch the fish · slide to look around</p>
</div></div></div>
<button id=o aria-label=Menu>≡</button><pre id=i></pre>
<script>
/*SCRIPT*/
</script>
<script>
/*RUNTIME*/
</script>
</body>
</html>
